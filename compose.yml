services:
  prestashop:
    build:
      context: .docker/prestashop
      args:
        PS_VERSION_TAG: ${PS_VERSION_TAG:-9}
        MODULE_NAME: ${MODULE_NAME:?}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    environment:
      MODULE_NAME: ${MODULE_NAME:?}
      DB_SERVER: db
      DB_NAME: ${DB_NAME:-prestashop}
      DB_USER: ${DB_USER:-prestashop}
      DB_PASSWD: ${DB_PASSWORD:-prestashop}
      PS_DEV_MODE: ${PS_DEV_MODE:-1}
      PS_INSTALL_AUTO: ${PS_INSTALL_AUTO:-1}
      PS_DOMAIN: ${PS_DOMAIN:-localhost:${PS_HTTP_PORT:-80}}
      PS_FOLDER_ADMIN: ${PS_FOLDER_ADMIN:-admin-dev}
      ADMIN_MAIL: ${PS_ADMIN_MAIL:-admin@example.com}
      ADMIN_PASSWD: ${PS_ADMIN_PASSWD:-prestashop}
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-client_host=host.docker.internal}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${PS_HTTP_PORT:-80}:80"
    volumes:
      - ./prestashop/${PS_VERSION_TAG:-9}:/var/www/html
      - ./module:/var/www/html/modules/${MODULE_NAME:?}
    profiles:
      - prestashop
    networks:
      - prestashop

  db:
    image: mysql:${DB_VERSION_TAG:-5.7}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-prestashop}
      MYSQL_USER: ${DB_USER:-prestashop}
      MYSQL_PASSWORD: ${DB_PASSWORD:-prestashop}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles:
      - prestashop
    networks:
      - prestashop

  adminer:
    image: adminer
    ports:
      - ${ADMINER_PORT:-8080}:8080
    depends_on:
      - db
    profiles:
      - prestashop
    networks:
      - prestashop

  tooling:
    build:
      context: .docker/tooling
      args:
        MODULE_NAME: ${MODULE_NAME:?}
    environment:
      _PS_ROOT_DIR_: /app/prestashop
    volumes:
      - ./prestashop/${PS_VERSION_TAG:-9}:/app/prestashop
      - ./module:/app/prestashop/modules/${MODULE_NAME:?}
      - tooling_phpstan_cache:/tmp/phpstan
    profiles:
      - tooling
    networks:
      - tooling

  tests:
    build:
      context: .docker/tests
      args:
        MODULE_NAME: ${MODULE_NAME:?}
        TESTS_PHP_VERSION: ${TESTS_PHP_VERSION:-8.5}
    volumes:
      - ./prestashop/${PS_VERSION_TAG:-9}:/app/prestashop
      - ./module:/app/prestashop/modules/${MODULE_NAME:?}
    profiles:
      - tests
    networks:
      - tests

volumes:
  db_database:
  tooling_phpstan_cache:

networks:
  prestashop:
  tests:
  tooling:
